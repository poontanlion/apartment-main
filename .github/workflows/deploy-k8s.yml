name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["Docker Build and Publish"]
    types:
      - completed
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Kubernetes Cluster
    # This runner must be installed on the Windows host that runs Minikube.
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: pwsh
    env:
      # workflow_run's github.sha is the default-branch SHA. Deploy the commit
      # that actually produced the Docker images instead.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    # Only deploy if Docker Build and Publish was successful (or triggered manually)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Validate required deployment secrets
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          $missing = @()
          foreach ($name in @('DB_USERNAME', 'DB_PASSWORD', 'ADMIN_EMAIL', 'ADMIN_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing required GitHub Actions secrets: $($missing -join ', ')"
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify Kubernetes access
        run: |
          $context = kubectl config current-context
          if ($LASTEXITCODE -ne 0 -or $context.Trim() -ne 'minikube') {
            Write-Error "The runner must use the Minikube context. Current context: $context"
            exit 1
          }
          kubectl get --raw=/version | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'The runner cannot reach the Minikube API. Run this runner under the Windows account that owns the Minikube kubeconfig.'
            exit 1
          }

      - name: Create/Update DB Secret
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          foreach ($name in @('DB_USERNAME', 'DB_PASSWORD', 'ADMIN_EMAIL', 'ADMIN_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Error "GitHub secret $name is not set"
              exit 1
            }
          }
          $secretArgs = @(
            'create', 'secret', 'generic', 'apartment-db-secret'
            "--from-literal=DB_USERNAME=$env:DB_USERNAME"
            "--from-literal=DB_PASSWORD=$env:DB_PASSWORD"
            '--from-literal=POSTGRES_DB=apartmentdb'
            "--from-literal=POSTGRES_USER=$env:DB_USERNAME"
            "--from-literal=POSTGRES_PASSWORD=$env:DB_PASSWORD"
            "--from-literal=ADMIN_EMAIL=$env:ADMIN_EMAIL"
            "--from-literal=ADMIN_PASSWORD=$env:ADMIN_PASSWORD"
            '--dry-run=client', '-o', 'yaml'
          )
          kubectl @secretArgs | kubectl apply -f -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply PostgreSQL
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status statefulset/postgres --timeout=180s

      - name: Apply ConfigMap
        run: kubectl apply -f k8s/configmap.yaml

      - name: Apply Deployment and Services
        run: kubectl apply -f k8s/deployment.yaml

      - name: Update Backend image to built commit
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $dockerUser = if ($env:DOCKERHUB_USERNAME) { $env:DOCKERHUB_USERNAME } else { 'pixiz' }
          kubectl set image deployment/apartment-backend-deployment "backend=$dockerUser/apartment-backend:sha-$env:DEPLOY_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Update Frontend image to built commit
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $dockerUser = if ($env:DOCKERHUB_USERNAME) { $env:DOCKERHUB_USERNAME } else { 'pixiz' }
          kubectl set image deployment/apartment-frontend-deployment "frontend=$dockerUser/apartment-frontend:sha-$env:DEPLOY_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Wait for Backend rollout
        run: kubectl rollout status deployment/apartment-backend-deployment --timeout=120s

      - name: Wait for Frontend rollout
        run: kubectl rollout status deployment/apartment-frontend-deployment --timeout=120s

      - name: Report Result
        if: always()
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          $dockerUser = if ($env:DOCKERHUB_USERNAME) { $env:DOCKERHUB_USERNAME } else { 'pixiz' }
          @(
            '## Deploy to Kubernetes Report'
            '- Status: ${{ job.status }}'
            '- Trigger: ${{ github.event_name }}'
            "- Branch: $env:DEPLOY_BRANCH"
            "- Commit: sha-$env:DEPLOY_SHA"
            "- Backend image: $dockerUser/apartment-backend:sha-$env:DEPLOY_SHA"
            "- Frontend image: $dockerUser/apartment-frontend:sha-$env:DEPLOY_SHA"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
