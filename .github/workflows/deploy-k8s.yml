name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["Docker Build and Publish"]
    types:
      - completed
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Kubernetes Cluster
    runs-on: ubuntu-latest
    env:
      # workflow_run's github.sha is the default-branch SHA. Deploy the commit
      # that actually produced the Docker images instead.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    # Only deploy if Docker Build and Publish was successful (or triggered manually)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Validate required deployment secrets
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          missing=()
          for v in KUBECONFIG_DATA DB_USERNAME DB_PASSWORD ADMIN_EMAIL ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              name="$v"
              [ "$v" = "KUBECONFIG_DATA" ] && name="KUBECONFIG"
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s\n' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify Kubernetes access
        run: |
          if ! kubectl get --raw=/version >/dev/null 2>&1; then
            echo "::error::KUBECONFIG is present, but the runner cannot connect to the Kubernetes cluster. Check the kubeconfig and service-account access."
            exit 1
          fi

      - name: Create/Update DB Secret
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          for v in DB_USERNAME DB_PASSWORD ADMIN_EMAIL ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::GitHub secret $v is not set"; exit 1; fi
          done
          kubectl create secret generic apartment-db-secret \
            --from-literal=DB_USERNAME="$DB_USERNAME" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=POSTGRES_DB=apartmentdb \
            --from-literal=POSTGRES_USER="$DB_USERNAME" \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=ADMIN_EMAIL="$ADMIN_EMAIL" \
            --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply PostgreSQL
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status statefulset/postgres --timeout=180s

      - name: Apply ConfigMap
        run: kubectl apply -f k8s/configmap.yaml

      - name: Apply Deployment and Services
        run: kubectl apply -f k8s/deployment.yaml

      - name: Update Backend image to built commit
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          DOCKER_USER="${DOCKERHUB_USERNAME:-pixiz}"
          kubectl set image deployment/apartment-backend-deployment \
            backend="${DOCKER_USER}/apartment-backend:sha-${DEPLOY_SHA}"

      - name: Update Frontend image to built commit
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          DOCKER_USER="${DOCKERHUB_USERNAME:-pixiz}"
          kubectl set image deployment/apartment-frontend-deployment \
            frontend="${DOCKER_USER}/apartment-frontend:sha-${DEPLOY_SHA}"

      - name: Wait for Backend rollout
        run: kubectl rollout status deployment/apartment-backend-deployment --timeout=120s

      - name: Wait for Frontend rollout
        run: kubectl rollout status deployment/apartment-frontend-deployment --timeout=120s

      - name: Report Result
        if: always()
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          DOCKER_USER="${DOCKERHUB_USERNAME:-pixiz}"
          {
            echo "## Deploy to Kubernetes Report"
            echo "- Status: ${{ job.status }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Branch: ${DEPLOY_BRANCH}"
            echo "- Commit: sha-${DEPLOY_SHA}"
            echo "- Backend image: ${DOCKER_USER}/apartment-backend:sha-${DEPLOY_SHA}"
            echo "- Frontend image: ${DOCKER_USER}/apartment-frontend:sha-${DEPLOY_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
