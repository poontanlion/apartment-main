name: Docker Build and Publish

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to GitHub repository Actions secrets."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

      - name: Build and push backend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/apartment-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/apartment-backend:sha-${{ github.sha }}

      - name: Build frontend image (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false

      - name: Build and push frontend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/apartment-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/apartment-frontend:sha-${{ github.sha }}

      - name: Report Result
        if: always()
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "## Docker Build and Publish Report"
            echo "- Status: ${{ job.status }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Pull requests: build only (no push)"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "- Publish: skipped for pull requests"
            elif [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "- Backend image: $DOCKERHUB_USERNAME/apartment-backend"
              echo "- Frontend image: $DOCKERHUB_USERNAME/apartment-frontend"
              echo "- Tags: latest, sha-$GITHUB_SHA"
            else
              echo "- Publish: not configured; set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
