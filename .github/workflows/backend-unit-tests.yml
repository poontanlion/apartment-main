name: Backend Unit Tests

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-unit-tests.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-unit-tests.yml'
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Unit Tests
        working-directory: ./backend
        run: ./mvnw test -Dtest="*ControllerTest"

      - name: Publish Unit Test Report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Backend Unit Test Results
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Report Result
        if: always()
        run: |
          {
            echo "## Backend Unit Tests Report"
            echo "- Status: ${{ job.status }}"
            echo "- Test scope: *ControllerTest"
            echo "- JUnit XML: backend/target/surefire-reports/*.xml"
          } >> "$GITHUB_STEP_SUMMARY"
