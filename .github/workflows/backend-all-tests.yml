name: Backend All Tests

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-all-tests.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-all-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Run All Tests
        working-directory: ./backend
        run: ./mvnw test

      - name: Publish All Test Report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Backend All Test Results
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Report Result
        if: always()
        run: |
          {
            echo "## Backend All Tests Report"
            echo "- Status: ${{ job.status }}"
            echo "- Test scope: All Maven tests"
            echo "- JUnit XML: backend/target/surefire-reports/*.xml"
          } >> "$GITHUB_STEP_SUMMARY"
