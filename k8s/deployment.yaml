# ============================================================
# Backend Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apartment-backend-deployment
  labels:
    app: apartment-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apartment-backend
  template:
    metadata:
      labels:
        app: apartment-backend
    spec:
      containers:
      - name: backend
        image: pixiz/apartment-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: apartment-backend-config
        livenessProbe:
          httpGet:
            path: /api/general/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/general/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
# ============================================================
# Backend Service (ClusterIP — accessible only inside cluster)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: apartment-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
# ============================================================
# Frontend Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apartment-frontend-deployment
  labels:
    app: apartment-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apartment-frontend
  template:
    metadata:
      labels:
        app: apartment-frontend
    spec:
      containers:
      - name: frontend
        image: pixiz/apartment-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
# ============================================================
# Frontend Service (NodePort — accessible from outside cluster)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: apartment-frontend-service
spec:
  type: NodePort
  selector:
    app: apartment-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
