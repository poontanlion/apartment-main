# ============================================================
# PostgreSQL Service (ClusterIP — accessible only inside cluster)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: apartment-postgres
spec:
  type: ClusterIP
  selector:
    app: apartment-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
# ============================================================
# PostgreSQL StatefulSet (data persisted on a PersistentVolume)
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: apartment-postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: apartment-postgres
  template:
    metadata:
      labels:
        app: apartment-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: apartment-db-secret
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: apartment-db-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: apartment-db-secret
              key: POSTGRES_PASSWORD
        # Subdirectory avoids initdb failing on the volume's lost+found
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi
