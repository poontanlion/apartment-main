global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert-rules.yaml"

scrape_configs:
  - job_name: "apartment-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8080", "host.docker.internal:8080"]
        labels:
          application: "apartment-backend"
          environment: "local-dev"
