# Application configuration
server.port=${SERVER_PORT:8080}
# Optional workstation overrides; .env is ignored by Git.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# PostgreSQL (defaults are for local dev only; override via environment in prod)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apartmentdb}
spring.datasource.username=${DB_USERNAME:apartment}
spring.datasource.password=${DB_PASSWORD:apartment}

# JPA / Hibernate (schema is managed by Flyway; Hibernate only validates it)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Spring Boot Actuator & Health Probes (Kubernetes & CI/CD)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Admin Security & Credentials (Configurable via Environment Variables)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@victoryapartment.com}
app.admin.password=${ADMIN_PASSWORD:admin}

# File & Payload Size Configurations (for Scanned Documents / Slips)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
