services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apartment_prediction_dev
      POSTGRES_USER: ${DB_USERNAME:-apartment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apartment}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/apartment_prediction_dev
      DB_USERNAME: ${DB_USERNAME:-apartment}
      DB_PASSWORD: ${DB_PASSWORD:-apartment}
      SERVER_PORT: 8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@victoryapartment.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

name: apartment-prediction-local

volumes:
  pgdata-local:
